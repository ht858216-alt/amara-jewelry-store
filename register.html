<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register - Amara — Fine Jewelry</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <a href="index.html" class="logo-wrapper">
    <span class="logo">Amara</span>
    <span class="logo-sub">FINE JEWELRY</span>
  </a>
  <div id="header-right"></div>
</header>

<div class="form-wrapper">
  <form id="register-form">
    <div class="form-grid">
      <div class="field">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="Enter first name" required />
      </div>
      <div class="field">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Enter last name" required />
      </div>
      <div class="field full">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email" required />
      </div>
      <div class="field full">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required minlength="4" />
      </div>
    </div>
    <p class="error-msg" id="error-msg"></p>
    <button type="submit">Register</button>
  </form>
  <p class="form-footer">Have an account? <a href="login.html">Login</a></p>
</div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/register.js"></script>
</body>
</html>
