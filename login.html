<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - Amara — Fine Jewelry</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <a href="index.html" class="logo-wrapper">
    <span class="logo">Amara</span>
    <span class="logo-sub">FINE JEWELRY</span>
  </a>
  <div id="header-right"></div>
</header>

<div class="form-wrapper" style="max-width:480px;">
  <form id="login-form">
    <div class="form-grid single">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
      </div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="remember" />
      <label for="remember">Remember me</label>
    </div>
    <p class="error-msg" id="error-msg"></p>
    <button type="submit">Login</button>
  </form>
  <p class="form-footer">Don't have an account? <a href="register.html">Register</a></p>
</div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
